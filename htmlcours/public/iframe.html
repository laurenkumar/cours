<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Nouveau cours</title>
    <style>html {background-color: #fff;}</style>
    <script>
        window.addEventListener('message', (event) => {
            const { html, css, js } = event.data;
            if(html !== undefined) {
                document.body.innerHTML = html;  // Insert HTML content
            }
            if(css !== undefined) {
                const style = document.createElement('style');
                style.textContent = css;         // Insert CSS content
                document.head.appendChild(style);
            }
        }, false);
    </script>
</head>
